<!doctype html>

<x-dc>
<helmet>
  <style>
    .t{
      --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --line:#e2e8f0; --hover:#f1f5f9;
      --subtle:#f8fafc;
      --accent:#2563eb; --accent-hover:#1d4ed8; --on-accent:#ffffff;
      --ok:#15803d; --ok-bg:#f0fdf4; --warn:#b45309; --warn-bg:#fffbeb;
      --err:#b91c1c; --err-bg:#fef2f2; --disabled:#94a3b8;
      --stage:#eef2f6;
      --ring:rgba(37,99,235,.32);
      --shadow-sm:0 1px 2px rgba(15,23,42,.06);
      --shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 24px rgba(15,23,42,.08);
    }
    .t.dark{
      --bg:#14181f; --fg:#e6eaf2; --muted:#97a1b3; --line:#262c36; --hover:#1c2230;
      --subtle:#1a1f29;
      --accent:#60a5fa; --accent-hover:#93c5fd; --on-accent:#0b1220;
      --ok:#4ade80; --ok-bg:#0f2419; --warn:#fbbf24; --warn-bg:#2a2110;
      --err:#fb7185; --err-bg:#2b1418; --disabled:#4c566a;
      --stage:#0b0e13;
      --ring:rgba(96,165,250,.36);
      --shadow-sm:0 1px 2px rgba(0,0,0,.5);
      --shadow:0 1px 3px rgba(0,0,0,.6), 0 12px 28px rgba(0,0,0,.45);
    }
    body{ margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    *{ box-sizing:border-box; }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ color:var(--accent-hover); text-decoration:underline; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .sp{ width:11px; height:11px; border:2px solid currentColor; border-right-color:transparent;
         border-radius:50%; animation:spin .7s linear infinite; }
    .sp-lg{ width:22px; height:22px; border-width:2.5px; }
    @media (prefers-reduced-motion: reduce){ .sp{ animation-duration:2s; } }
    .sk{ background:var(--line); border-radius:4px; }
  </style>
</helmet>
<div class="{{theme}}" style="background:var(--stage); padding:20px; display:flex; justify-content:center;"><div style="width:360px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden;"><div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line);"><div style="display:flex; align-items:center; gap:8px; min-width:0;"><span style="display:inline-flex; color:var(--accent);"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 10 6.5l6 6"></path><path d="M5 16h10"></path></svg></span><span style="font-weight:650; letter-spacing:-.01em;">Bumpr</span></div></div><div style="padding:34px 26px 30px; text-align:center;"><div style="width:46px; height:46px; margin:0 auto 16px; border-radius:12px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center;"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 10 6.5l6 6"></path><path d="M5 16h10"></path></svg></div><h1 style="margin:0 0 8px; font-size:16.5px; font-weight:650; letter-spacing:-.01em;">Put your ads back on top</h1><p style="margin:0 0 20px; font-size:13px; color:var(--muted); line-height:1.5;">Sign in to relist your Marktplaats ads in one click. Three a month are free.</p><button type="button" style="width:100%; padding:10px 14px; border:0; border-radius:8px; font:inherit; font-size:14px; font-weight:600; color:var(--on-accent); background:linear-gradient(135deg,var(--accent),var(--accent-hover)); cursor:pointer;">Sign in</button><p style="margin:14px 0 0; font-size:11.5px; color:var(--muted); line-height:1.5;">Bumpr never sees your Marktplaats password — relisting runs in your own browser session.</p></div></div></div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 't dark' : 't' };
  }
}
</script>
</body>
</html>
