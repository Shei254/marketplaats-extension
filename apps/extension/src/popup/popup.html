<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{brand.name}}</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --line: #ececec;
        --hover: #f7f8fa;
        --accent: #0a5fd6;
        --accent-hover: #0b4fb0;
        --on-accent: #ffffff;
        --ok: #0a7d28;
        --ok-bg: #e8f6ec;
        --warn: #a15c00;
        --warn-bg: #fdf3e2;
        --err: #c02626;
        --disabled: #a5abb5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --line: #34363a;
          --hover: #26282c;
          --accent: #4285f4;
          --accent-hover: #5b96f7;
          --on-accent: #10131a;
          --ok: #6dd58c;
          --ok-bg: #1d2b21;
          --warn: #e8b558;
          --warn-bg: #2e2617;
          --err: #f28b82;
          --disabled: #5f6368;
        }
      }

      * { box-sizing: border-box; }

      body {
        font: 14px system-ui, sans-serif;
        margin: 0;
        width: 360px;
        background: var(--bg);
        color: var(--fg);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
      }

      #refresh {
        border: 0;
        background: none;
        padding: 4px 6px;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }
      #refresh:hover:not(:disabled) { background: var(--hover); }
      #refresh:disabled { color: var(--disabled); cursor: default; }

      #status { padding: 14px; color: var(--muted); line-height: 1.4; }

      #banner {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--ok-bg);
        color: var(--ok);
        font-size: 13px;
        line-height: 1.4;
      }

      ul { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
      li { padding: 10px 14px; border-bottom: 1px solid var(--line); }
      li:last-child { border-bottom: 0; }
      li[data-state="busy"] { background: var(--hover); }

      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .info { min-width: 0; }
      .title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .price { display: block; margin-top: 2px; font-size: 13px; color: var(--muted);
               font-variant-numeric: tabular-nums; }

      .repost {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
        cursor: pointer;
      }
      .repost:hover:not(:disabled) { background: var(--accent-hover); }
      .repost:disabled { cursor: default; }
      .repost[data-variant="busy"] { background: var(--disabled); }
      .repost[data-variant="done"] { background: var(--ok-bg); color: var(--ok); }
      .repost[data-variant="retry"] { background: var(--warn); color: var(--on-accent); }
      .repost[data-locked] { background: var(--disabled); }

      .spinner {
        width: 11px;
        height: 11px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

      .note {
        margin: 8px 0 2px;
        padding: 7px 9px;
        border-radius: 6px;
        font-size: 12.5px;
        line-height: 1.4;
      }
      .note[data-tone="error"] { color: var(--err); background: var(--warn-bg); }
      .note[data-tone="warn"] { color: var(--warn); background: var(--warn-bg); }
      .note[data-tone="ok"] { color: var(--ok); background: var(--ok-bg); }
    </style>
  </head>
  <body>
    <header>
      <span>{{brand.name}}</span>
      <button id="refresh" type="button" disabled>Refresh</button>
    </header>
    <div id="banner" hidden></div>
    <div id="status">Loading…</div>
    <ul id="ads" hidden></ul>
    <script type="module" src="popup.js"></script>
  </body>
</html>
