spring:
  application:
    name: mprelist-api

  # The `mprelist` database of infra/docker-compose.yml. Development-only credentials, committed for the
  # same reason they are committed there — `up` then `bootRun` should need no step in between. Anywhere
  # else these are overridden by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  #
  # Flyway needs no block of its own: enabled, classpath:db/migration and validate-before-migrate are its
  # defaults, and they are what this wants. It migrates on startup, which is why Keycloak was given a
  # separate database — two schema managers in one is the collision infra/README.md avoids.
  datasource:
    url: jdbc:postgresql://localhost:5432/mprelist
    username: mprelist
    password: mprelist

  security:
    oauth2:
      resourceserver:
        jwt:
          # The `mprelist` realm of infra/docker-compose.yml: its KC_HOSTNAME and the realm name that
          # infra/keycloak/mprelist-realm.json declares, which is a pairing
          # `theIssuerThisApiTrustsIsTheRealmTheLocalStackServes` holds rather than a comment.
          #
          # Discovery from this URI is deferred until the first token arrives, so Keycloak does not have to
          # be up for the application to start — only for anyone to get in. Overridden elsewhere by
          # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI.
          issuer-uri: http://localhost:8081/realms/mprelist
          # Every client in that realm shares the issuer above, so without this a token minted for the
          # dashboard's own use — or for `account`, which Keycloak issues to anybody — would be one this API
          # accepts. The audience mapper on both public clients puts this name in the tokens they mint, and
          # `mprelist-api` exists to be it.
          audiences: mprelist-api

server:
  # Pinned, though it is also Boot's default: infra/docker-compose.yml gives Keycloak 8081 specifically to
  # keep 8080 free for this application, and that pairing should not rest on a default staying put.
  port: 8080

mprelist:
  # Which browser origins may call this API. Every client of it is cross-origin — the extension from
  # `chrome-extension://<id>`, and `apps/web` from its own host — so without this a browser refuses the
  # answer before any of our code sees a problem: a console line about a missing Access-Control-Allow-Origin,
  # and a popup showing "unavailable" for a backend that answered perfectly well.
  #
  # The id is T44's pinned one. Unlike infra/keycloak's realm file, which substitutes it from the
  # environment because it is imported once and a wrong value there costs a `down -v`, this **defaults to
  # the id itself** — a value re-read on every start, where being wrong costs a restart.
  #
  # That is the trade this setting is: the environment variable was tried first and every developer met the
  # same failure, which is a browser refusing an answer and naming nothing about this application. What
  # keeps the literal from going stale is not care, it is
  # `theOriginThisApiAllowsIsDerivedFromTheKeyTheExtensionIsPinnedBy` — which derives the id from the `key`
  # in apps/extension/public/manifest.template.json exactly as `npm run extension-id` does, and fails the
  # build if this line disagrees. The variable still wins where it is set, which is what the Web Store's own
  # id will need at publish (#87).
  #
  # `apps/web`'s origins join this list at T50/T54. Comma-separated, matched exactly, no patterns.
  cors:
    allowed-origins: chrome-extension://${MPRELIST_EXTENSION_ID:dolloiambeojifmnofjchofbnepodiof}

  # #82: the signing secret of the Stripe webhook endpoint, and the whole of the authentication on the one
  # route here that no bearer token reaches. Stripe signs the exact bytes it sends with it.
  #
  # From the environment with an **empty** default, unlike the settings below, and the difference is that this
  # one is a secret: it cannot be committed, it is different for every developer's `stripe listen` session and
  # different again for each deployed endpoint. Unset, the application starts and says so at WARN, and every
  # event is refused — which is the only safe reading of "we cannot tell whether this is Stripe", and keeps a
  # developer who is working on something else from having to hold a Stripe secret to run the API at all.
  stripe:
    webhook-secret: ${MPRELIST_STRIPE_WEBHOOK_SECRET:}
    # #80: the API key `GET /api/plans` reads amounts with, and the same empty default for the same reason —
    # it is a secret, and a developer working on something else should not need one to run this application.
    # Unset, every price lookup fails and the plan cards say "unavailable, retry", which is the fail-closed
    # answer and never an invented amount.
    secret-key: ${MPRELIST_STRIPE_SECRET_KEY:}
    # How long an amount fetched from Stripe is remembered. **Not a freshness setting**: Stripe Prices are
    # immutable (ADR-0019), so a cached amount for a given id cannot go stale — what changes is which id a
    # tier points at, and that is read from our own table on every request. What this bounds is how long a
    # mistake could go on being shown, which is why it is minutes rather than never.
    #
    # No fallback, like the rails below: the wrong value is silent in both directions.
    price-cache: 15m

  # #52: the oldest extension build this API still serves, named in the `X-Mprelist-Client` header every
  # client sends. `0` is every build there has ever been, and it is the only value here that is not a
  # decision: raising it strands every user who has not updated, and a store review takes days, so it is for
  # correctness and safety only — never for tidiness. The policy the rest of the time is that this API stays
  # additive, which is what makes a lever this blunt something you almost never pull.
  #
  # Stated rather than defaulted in code, like the rails below and for the same reason: the wrong value is
  # silent in both directions. There is no line for apps/web because it does not call this API yet (T54, #85).
  clients:
    minimum-extension-version: 0

  # #29: where a browser lands after Stripe Checkout — `apps/web`'s public pages (T50, #81), which carry no
  # authentication at all. The Vite dev server's address locally; the deployed origin at T55 (#86), by which
  # time it is also what the realm has to allow (T56, #87).
  #
  # No fallback, like the rails below: a wrong value here sends a paying customer to a page that does not
  # exist, at the moment they have just been charged, and it is silent from this side.
  web:
    base-url: http://localhost:5173

  # #24: what to do about a relist that was authorized and never reported on. Both settings are here rather
  # than defaulted in code, and neither has a fallback — a missing one fails startup instead of running with
  # a window nobody chose, because the wrong value here is silent in both directions.
  reconciliation:
    # How long past a grant running out a reservation is left alone before its unit is handed back.
    #
    # Not "how long a relist takes". The grant itself is ~45s (enforcement-contract.md), and a relist is a
    # capture, a photo download, a delete and a create with uploads — but the extension may also be asleep,
    # throttled, or waiting on a user, and the contract deliberately puts no deadline on reporting. This is
    # how long we wait before concluding that no report is coming at all.
    #
    # Generous, because the two mistakes are not symmetric. Guessing too early costs almost nothing: the
    # relist that was still running reports in the end, and that report settles the unit back (#23). Guessing
    # too late is what the ticket exists to stop — a free user is three relists a month, so one browser closed
    # at the wrong moment is a third of their quota held until this runs.
    grace: 30m
    # How often the guess is made, and so — with the grace above — the longest a user waits for a unit their
    # browser took with it. A fixed delay, and it fires once at startup too, which is what reconciles whatever
    # accumulated while nothing was running.
    interval: 5m

  # #25: how fast one account may relist. Rails for the *user's* Marktplaats account rather than a throttle
  # protecting ours (ADR-0008) — relisting is delete-and-recreate against a private API, and the account that
  # gets flagged for a machine-shaped rhythm is the seller's. Nothing here is about our own load.
  #
  # All three are here rather than defaulted in code, and none has a fallback, for the reconciliation block's
  # reason: how fast is too fast is a judgement about a platform that publishes no number, and the day a ban
  # wave says ours was wrong is a day to change a setting rather than to ship a release. A missing one fails
  # startup instead of running with a rail nobody chose.
  safety:
    # How long after a relist before the next may be authorized. Zero turns this rail off — which is a
    # setting, and the one the suites whose subject is quota are run with.
    #
    # Roughly how long a person takes to find their next ad and click it. This is the rail that keeps two
    # relists from arriving in a volley; it is not a cap on anything, which is what the two below are for.
    # Jitter around it is #54's and has to be the extension's: a backend can deny a call that came too soon,
    # it cannot make one arrive at a human-shaped moment.
    minimum-interval: 30s
    # How many may be authorized inside the window below, and at least 1 — "none per window" is a gate
    # nobody gets through and no wait resolves, so it is refused where it is configured.
    #
    # The interval alone caps nothing worth capping: 30s permits 120 relists an hour, which is a Power
    # tier's entire month in under two, at a rhythm no human has. Ten in an hour is a seller working through
    # a batch of their own ads and then stopping, which is the shape being imitated. A free user never
    # reaches it — three relists is their month — so this rail is the paying tiers'.
    burst-limit: 10
    # The span that cap counts in, sliding rather than aligned to a clock: a window that reset on the hour
    # would let twice the cap through across the boundary.
    #
    # It has to exceed `burst-limit` × `minimum-interval` or the cap is one arithmetic can never reach — the
    # interval alone would keep the count under it — and a rail written off by arithmetic is one nobody
    # decided to switch off. Five minutes of relists in an hour, so 55 of that hour are the cap's to refuse.
    burst-window: 1h
