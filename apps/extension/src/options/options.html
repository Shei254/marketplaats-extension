<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marktplaats Relist — Endpoint config</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 24px; max-width: 640px; }
      h1 { font-size: 18px; }
      p.hint { color: #555; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; }
      button { margin-top: 18px; padding: 8px 16px; font: inherit; }
      #status { margin-left: 12px; color: #0a7d28; }
      code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Marktplaats internal-API endpoints</h1>
    <p class="hint">
      Paste the endpoints discovered in DevTools (spike #2/#3/#4). Paths may be
      absolute or site-relative; use <code>:id</code> where the ad id goes.
      Saved to the extension and used immediately — no rebuild needed.
    </p>
    <form id="form">
      <label for="listMyAds">List my ads (GET)</label>
      <input id="listMyAds" placeholder="/my-account/api/l/my-ads" />

      <label for="captureAd">Capture ad detail (GET, may contain :id)</label>
      <input id="captureAd" placeholder="/api/ads/:id" />

      <label for="deleteAd">Delete ad (DELETE, may contain :id)</label>
      <input id="deleteAd" placeholder="/api/ads/:id" />

      <label for="createAd">Create ad (POST)</label>
      <input id="createAd" placeholder="/api/ads" />

      <label for="uploadPhoto">Upload photo (POST multipart)</label>
      <input id="uploadPhoto" placeholder="/api/pictures" />

      <div class="row">
        <div>
          <label for="csrfMode">CSRF token source</label>
          <select id="csrfMode">
            <option value="meta">meta tag</option>
            <option value="cookie">cookie</option>
            <option value="none">none</option>
          </select>
        </div>
        <div>
          <label for="csrfName">Token name (meta/cookie)</label>
          <input id="csrfName" placeholder="csrf-token" />
        </div>
        <div>
          <label for="csrfHeader">Sent as header</label>
          <input id="csrfHeader" placeholder="x-csrf-token" />
        </div>
      </div>

      <button type="submit">Save</button>
      <span id="status"></span>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
