# Local development stack — Postgres for the API, Keycloak for identity (ADR-0009, ADR-0011).
#
# Development only. Every credential below is a well-known default, committed on purpose so that
# `docker compose up` needs no prior setup; nothing here is fit to deploy.
#
#   cp .env.example .env      # once, from the repository root
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
#
# `--env-file` is what fills in the variables further down that are declared with no value: the extension id
# the realm is built around and the SMTP credentials. It names a file at the repository root rather than one
# beside this file, because that same `.env` is what `apps/api`'s Gradle build loads into `bootRun` and its
# tests — one file for the whole repository, and one place a credential can be wrong. Anything exported in
# the shell still wins over it.
#
# See infra/README.md for ports, credentials and how to reset.

name: mprelist

services:
  postgres:
    # Pinned to the major: 18.x minors are drop-in, and an unpinned `postgres` would one day be
    # a major, which does not read an older major's data directory.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mprelist
      POSTGRES_PASSWORD: mprelist
      POSTGRES_DB: mprelist
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 declares its VOLUME at /var/lib/postgresql and puts PGDATA one level in,
      # at /var/lib/postgresql/18/docker — mounting the pre-18 /var/lib/postgresql/data here
      # would leave the real data directory inside the container, and every `down` would drop it.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory only. See infra/README.md § Resetting.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 on purpose: while the entrypoint runs ./postgres/init it holds a temporary
      # server open on the Unix socket alone (listen_addresses=''), so a socket probe reports ready
      # before `keycloak` exists. Over TCP that window is a refused connection, which is what makes
      # `--wait` mean the init scripts have finished rather than merely started.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mprelist -d mprelist"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  keycloak:
    # Pinned to the minor: a Keycloak upgrade migrates its own database schema on first start,
    # so a floating tag would silently migrate one developer's stack and not another's.
    image: quay.io/keycloak/keycloak:26.7
    # `start-dev`: no TLS, no hostname strictness, no optimised build step. Never in production.
    # `--import-realm` reads every file in the mount below. The strategy is IGNORE_EXISTING, so this
    # is a first-start action: once `mprelist` is in Keycloak's database an edited realm file is not
    # an error, it simply never applies — the same trap as ./postgres/init, and the same fix, `down -v`.
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      # Bootstrap admin for the console at http://localhost:8081/admin. Created on first start only.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Its own database in the same instance, created by ./postgres/init. Not the app's database:
      # Flyway (#17) owns `mprelist` and would collide with Keycloak's schema management.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Fixes the issuer at the host-side URL. Without it Keycloak derives the issuer from the
      # request, so a token fetched via localhost:8081 and one fetched via keycloak:8080 disagree,
      # and the resource server (#19) rejects one of them.
      KC_HOSTNAME: http://localhost:8081
      # Serves /health/* on the management port, 9000. Off by default; the healthcheck needs it.
      KC_HEALTH_ENABLED: "true"
      # No value: passed through from the shell only when the shell has it, which is what lets
      # ./keycloak/mprelist-realm.json fall back to its own `${MPRELIST_EXTENSION_ID:unset-extension-id}`
      # default. Setting it here to "" would defeat that — the variable would be *defined and empty*,
      # and the realm would register a redirect URI with no host in it. See infra/README.md.
      MPRELIST_EXTENSION_ID:
      # This stack is the laptop, and on a laptop plain HTTP has to work. Keycloak's `external` demands
      # HTTPS from every client whose address is not loopback or private — and a request published
      # through Docker Desktop's port forwarder reaches the container from a *public* address, so the
      # browser's own sign-in is refused with 403 "HTTPS required". Set here rather than in the realm
      # file, which keeps `external` as its default: a production import that never sets this variable
      # is the one that must not be relaxed. See infra/README.md.
      MPRELIST_SSL_REQUIRED: none
      # Mailtrap's sandbox, for the mail a self-registered user's password reset sends. No values, for the
      # same reason as the id above — the realm file's own defaults are the host and port, and the two
      # credentials have no default worth having. Unset, Keycloak accepts the reset request and fails to
      # send; nothing else in the realm needs mail. They are secrets, so they live in your gitignored `.env`
      # (commented out until you have values, since an empty assignment arrives here *defined and empty* and
      # defeats the realm's own defaults) and never in this file. See infra/README.md.
      MPRELIST_SMTP_HOST:
      MPRELIST_SMTP_PORT:
      MPRELIST_SMTP_FROM:
      MPRELIST_SMTP_USER:
      MPRELIST_SMTP_PASSWORD:
    ports:
      # 8081, because 8080 is Spring Boot's default and apps/api (#16) runs on the host.
      - "8081:8080"
    healthcheck:
      # The image ships no curl or wget — this is bash's own /dev/tcp, which is why it is CMD-SHELL.
      # /health/ready is Keycloak's own readiness verdict; a listening port only means the JVM is up.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

volumes:
  postgres-data:
