passwordResetSubject=Reset your password \u00b7 AdBump
passwordResetBodyHtml=<p style\="font-family\: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; font-size\: 14px; font-weight\: 400; line-height\: 1.45; margin\: 0 0 14px; color\: \#0f172a">Someone asked to reset the password of your AdBump account. If that was you, choose a new password below.</p><p style\="margin\: 0 0 14px; text-align\: center"><a href\="{0}" style\="font-family\: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; font-size\: 14px; font-weight\: 600; line-height\: 1.2; display\: inline-block; box-sizing\: border-box; padding\: 10px 14px; border\: 1px solid transparent; border-radius\: 8px; color\: \#ffffff; background-color\: \#1d63ef; background-image\: linear-gradient(135deg, \#1d63ef, \#0b34f9); text-align\: center; text-decoration\: none">Choose a new password</a></p><p style\="font-family\: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; font-size\: 14px; font-weight\: 400; line-height\: 1.45; margin\: 0 0 14px; color\: \#0f172a">This link expires in {3}.</p><p style\="font-family\: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; font-size\: 14px; font-weight\: 400; line-height\: 1.45; margin\: 0 0 14px; color\: \#0f172a">If the button does not work, copy this link into your browser\:</p><p style\="font-family\: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; font-size\: 11.5px; font-weight\: 400; line-height\: 1.5; color\: \#64748b; word-break\: break-all">{0}</p><p style\="font-family\: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; font-size\: 13px; font-weight\: 400; line-height\: 1.5; margin\: 20px 0 0; color\: \#64748b">If you did not ask for this, you do not need to do anything. Your password stays as it is.</p><p style\="font-family\: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; font-size\: 13px; font-weight\: 400; line-height\: 1.5; margin\: 14px 0 0; color\: \#64748b">\u2014 AdBump</p>
passwordResetBody=Someone asked to reset the password of your AdBump account.\nIf that was you, choose a new password through this link\:\n\n{0}\n\nThis link expires in {3}.\n\nIf you did not ask for this, you do not need to do anything. Your password stays as it is.\n\n\u2014 AdBump\n
