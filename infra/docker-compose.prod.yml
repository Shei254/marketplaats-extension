# The deployed stack — five containers on one host (T55, #86, T56, #87, and docs/adr/0020-deployment.md,
# amended by docs/adr/0023-ci-builds-the-images-and-the-host-pulls.md).
#
# Everything here is the same software as infra/docker-compose.yml and none of the same settings. What
# changes between them is exactly what "deployed" means: no credential is committed, no port a browser has
# no business reaching is published, Keycloak runs its production mode instead of `start-dev`, and our own
# two workspaces are images CI built rather than processes on a developer's machine.
#
#   cp infra/production.env.example production.env    # once, on the host. Fill it in; it is gitignored
#   docker compose --env-file production.env -f infra/docker-compose.prod.yml up -d --wait
#
# **No `--build`, and no `build:` context anywhere below.** The host is 1 vCPU and 4 GB, and `apps/api`'s
# image compiles this repository inside itself — a third JVM wanting a gigabyte, competing for it with the
# two processes it is in the middle of replacing. So CI builds both images and pushes them to GHCR as
# `sha-<commit>`, a version tag retags that same digest, and this file names tags. See ADR-0023, and
# infra/deploy/mprelist-deploy, which is the script that pulls.
#
# Every `${…:?}` below is a variable with no default: compose refuses to start and names the one that is
# missing, which is the only moment anybody is looking. The realm imports on **first start only**, so
# `MPRELIST_REALM_DIR`, `MPRELIST_EXTENSION_ID` and the two site addresses the realm registers are the ones
# whose cost is a `down -v` rather than a restart.
#
# **TLS terminates in the `caddy` service at the bottom, and nothing else binds a port.** The other four
# exist only on this network. That is not the same as binding them to loopback, which is what this file used
# to suggest: there is no longer a port variable that somebody can set to a public value.
#
# **Every service has a memory limit**, and the API has a heap percentage as well. Neither is tuning. On 4 GB
# with no limits, Keycloak's image and the API's JVM each size a heap against the whole host and can total
# more than there is; what an operator then sees is not an error but the OOM killer taking the largest
# process and `restart: unless-stopped` bringing it back, forever. `mem_limit` alone would fix that and
# introduce a quieter fault — a modern JVM reads its cgroup, so 1 GB becomes a 256 MB heap at the default
# `MaxRAMPercentage` of ≈25%, which presents as latency rather than as a crash.

name: mprelist-production

services:
  postgres:
    # The same major the local stack runs and the suite tests against, spelled the same way. A schema proven
    # on one major and served by another is a divergence nothing reports until it is live.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mprelist
      POSTGRES_DB: mprelist
      POSTGRES_PASSWORD: ${MPRELIST_DB_PASSWORD:?the application's own database password}
      # Read by ./postgres/init-production/10-keycloak-database.sh, which runs once and creates the role
      # Keycloak signs in as. Not a second copy of the line below: this is where that role is *made*.
      MPRELIST_KEYCLOAK_DB_PASSWORD: ${MPRELIST_KEYCLOAK_DB_PASSWORD:?Keycloak's own database password}
    # Shared buffers, the page cache Postgres keeps of its own, and every connection's work memory. The
    # smallest number in the budget that is a real constraint rather than headroom: this is a subscription
    # ledger, and the largest thing it reads is a `pg_dump`.
    mem_limit: 512m
    volumes:
      - postgres-data:/var/lib/postgresql
      # Not ./postgres/init: that one writes a role whose password is the word `keycloak`, committed on
      # purpose for a laptop. Runs once, on an empty data directory only.
      - ./postgres/init-production:/docker-entrypoint-initdb.d:ro
    # **No `ports`.** The one thing on this host that a stranger must not be able to reach at all; the two
    # services that need it are on this network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mprelist -d mprelist"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    # `start`, not `start-dev`: hostname strictness on, the development-mode relaxations off. `--import-realm`
    # reads the directory mounted below, once, and never again while that database exists.
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # **The production realm, which is T56's (#87) to write** — not ./keycloak, whose realm carries two dev
      # users with a shared password, a thirty-day session and every redirect URI pointing at localhost. No
      # default, so a stack brought up without one stops here rather than importing that.
      # Long syntax, because the short one splits on the colons that a `${…:?}` message would land between.
      - type: bind
        source: ${MPRELIST_REALM_DIR:?the directory holding the production realm export}
        target: /opt/keycloak/data/import
        read_only: true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${MPRELIST_KEYCLOAK_DB_PASSWORD:?Keycloak's own database password}
      # The public address, which is what fixes the issuer in every token it mints — and so what
      # `SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI` below and the browser's own sign-in both have
      # to agree with. All three are derived from this one variable rather than written down three times.
      KC_HOSTNAME: ${MPRELIST_KEYCLOAK_URL:?the public https:// address Keycloak is served at}
      # TLS terminates in front of this (T56, #87), so the container speaks plain HTTP to the proxy and
      # trusts the proxy's own headers for the scheme and the client address. Without the second line
      # Keycloak sees every request as arriving over HTTP from the proxy, and every absolute URL it writes —
      # every redirect in the sign-in — comes back `http://`.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Created on **first start only**, and it is the account that can do anything to this realm. A
      # deployment that leaves these two at the local stack's `admin` / `admin` is a deployment anybody can
      # take over, so neither has a default here.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${MPRELIST_KEYCLOAK_ADMIN:?the bootstrap admin username, created on first start only}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MPRELIST_KEYCLOAK_ADMIN_PASSWORD:?the bootstrap admin password, created on first start only}
      # **`MPRELIST_SSL_REQUIRED` is deliberately absent**, which is the whole difference between this file
      # and the local one on the setting that matters most: the realm's own `${MPRELIST_SSL_REQUIRED:external}`
      # then applies, and `external` is the value that must never be relaxed by inheritance. See
      # infra/README.md § `sslRequired`.
      #
      # The extension id the realm registers `https://<id>.chromiumapp.org/` for, imported once. At publish
      # the Web Store assigns a different id than our own key derives (T56, #87), and this is where the
      # production realm learns it — wrong here costs a `down -v`, so it has no default either.
      MPRELIST_EXTENSION_ID: ${MPRELIST_EXTENSION_ID:?the published extension id, imported into the realm once}
      # And the two site origins the same import registers for `mprelist-dashboard` — the public site and the
      # admin corner, which are one bundle at two hostnames (ADR-0017). They are here rather than in the realm
      # file for the reason the extension id is: an export with one deployment's hostnames written into it is
      # one deployment's export, committed to git. Same cost if they are wrong, and the same `down -v`.
      MPRELIST_WEB_BASE_URL: ${MPRELIST_WEB_BASE_URL:?where the site is served from}
      MPRELIST_ADMIN_BASE_URL: ${MPRELIST_ADMIN_BASE_URL:?where the admin corner is served from}
      # Mail, for the password reset a real user will need. Passed through with no value, exactly as the
      # local stack does it, so that the realm's own defaults apply where these are absent.
      MPRELIST_SMTP_HOST:
      MPRELIST_SMTP_PORT:
      MPRELIST_SMTP_FROM:
      MPRELIST_SMTP_USER:
      MPRELIST_SMTP_PASSWORD:
    # Its own image runs a high `MaxRAMPercentage`, so this limit is what the heap is sized against rather
    # than the host's 4 GB. No flag of ours is needed beside it, unlike the API below.
    mem_limit: 1g
    # **No `ports`.** Reached at `auth.<domain>` through `caddy`, which is the only service here that binds
    # anything. A published port would also be a plain-HTTP one, which this realm answers `403 HTTPS required`
    # to from any non-local address — correctly.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  api:
    # Built by CI and pulled, never built here (ADR-0023). The tag is `sha-<commit>` for what `master`
    # produced and `v1.0.0` for a release, and a release tag is the *same digest* CI tested with a second name
    # on it — `docker buildx imagetools create` rather than a second build of the same source, which lock
    # files narrow but do not guarantee.
    image: ${MPRELIST_IMAGE_REPOSITORY:?where CI pushes the two images, e.g. ghcr.io/owner/repo}/api:${MPRELIST_IMAGE_TAG:?the release tag to run, which infra/deploy/mprelist-deploy writes}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Every one of these overrides a value application.yml commits for the local stack. The three
      # datasource lines are the ones with teeth: without them this container starts, finds no Postgres on
      # its own localhost, and fails — which is the loud half. The issuer is the quiet half, and it is quiet
      # in the worst way, because the application starts fine and refuses every token that arrives.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mprelist
      SPRING_DATASOURCE_USERNAME: mprelist
      SPRING_DATASOURCE_PASSWORD: ${MPRELIST_DB_PASSWORD:?the application's own database password}
      # The realm name is the realm file's and is not a deployment's to choose, so it is spelled here once
      # rather than being a variable that can disagree with the export T56 imports.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${MPRELIST_KEYCLOAK_URL:?the public https:// address Keycloak is served at}/realms/mprelist
      # Which browser origins may call this API. The extension's is a `chrome-extension://` origin built from
      # the published id; the site's is **two**, because the admin corner is served from a hostname of its own
      # (T56, #87, ADR-0017) and an origin is a hostname. Comma-separated, which is how `allowed-origins`
      # reads it — and both are needed: it is the admin corner that calls this API, and `www.` is what
      # Checkout sends a browser back to. One without the other is a working payment flow beside an admin
      # screen no browser will call, which is a pair of symptoms nobody would connect.
      MPRELIST_EXTENSION_ID: ${MPRELIST_EXTENSION_ID:?the published extension id, imported into the realm once}
      MPRELIST_WEB_ORIGIN: ${MPRELIST_WEB_BASE_URL:?where the site is served from},${MPRELIST_ADMIN_BASE_URL:?where the admin corner is served from}
      # And where a browser is sent after Checkout and after the Customer Portal. The same value as the
      # origin above because the site is served at the root of its own host; two settings because one is an
      # origin and the other is a URL, and `CrossOriginTest` holds them together.
      MPRELIST_WEB_BASE_URL: ${MPRELIST_WEB_BASE_URL:?where the site is served from}
      # Stripe. **Empty is allowed and is not an oversight**: T57 (#88) is what puts live keys here, and this
      # ticket has to be able to bring the stack up before it. Unset, the application starts, says so at WARN,
      # refuses every webhook it is sent and shows no amounts — which is fail-closed and never a guess.
      MPRELIST_STRIPE_SECRET_KEY: ${MPRELIST_STRIPE_SECRET_KEY:-}
      MPRELIST_STRIPE_WEBHOOK_SECRET: ${MPRELIST_STRIPE_WEBHOOK_SECRET:-}
      # The patch this API serves the extension the day Marktplaats moves a path (#36). Empty on a healthy
      # day, which is what makes a restart of this container the whole of that fix.
      MPRELIST_CLIENT_CONFIG: ${MPRELIST_CLIENT_CONFIG:-}
      # How long a repost waits for the one before it: the window the extension paces with, and the rail this
      # API refuses under. Empty is the ordinary state for all three and means the numbers the images ship
      # with — a build's own 10s–30s window, and a 5s rail. Passed through so that tuning them is this file's
      # env and a restart, rather than a Web Store review for one of them and a release for the other.
      MPRELIST_PACING_MIN_MS: ${MPRELIST_PACING_MIN_MS:-}
      MPRELIST_PACING_MAX_MS: ${MPRELIST_PACING_MAX_MS:-}
      # Unset rather than empty where nobody has set it: an empty duration is not a value this API can read,
      # and `:-` with nothing after it would hand it one. The application.yml default is what fills the gap.
      MPRELIST_MINIMUM_INTERVAL: ${MPRELIST_MINIMUM_INTERVAL:-5s}
      # **The limit below is not enough on its own, and it fails in the direction that looks like success.**
      # A modern JVM reads its cgroup, so `mem_limit: 1g` correctly bounds this container — to a 256 MB heap,
      # a quarter of its allowance, because ≈25% is the default `MaxRAMPercentage`. The stack would be
      # properly bounded and this application would collect garbage far harder than it should, which presents
      # as latency rather than as a crash: the harder of the two to trace back to a compose file.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    mem_limit: 1g
    # **No `ports`.** Reached at `api.<domain>` through `caddy`.
    healthcheck:
      # A 401 from a route that exists, which is a stronger statement than a listening port: it says the
      # application answered *and* that the resource server is in front of it. Anything else — a connection
      # refused while Flyway is still migrating, a 200 from a security filter that failed to install — is not
      # this stack being ready.
      test:
        - CMD-SHELL
        - wget -S -q -O /dev/null http://127.0.0.1:8080/api/me 2>&1 | grep -q ' 401 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    # As above: CI's image, pulled by tag. The build context that used to be here was the repository root,
    # which is the other reason this host compiles nothing — it would need a checkout as well as a toolchain.
    image: ${MPRELIST_IMAGE_REPOSITORY:?where CI pushes the two images, e.g. ghcr.io/owner/repo}/web:${MPRELIST_IMAGE_TAG:?the release tag to run, which infra/deploy/mprelist-deploy writes}
    restart: unless-stopped
    environment:
      # What the bundle is *told*, rather than what it was built with — served as `/config.js` and read as a
      # patch over `admin-config.ts`'s defaults. Both are derived from the variables above, so the admin
      # corner cannot end up signing into one realm while the API trusts another.
      MPRELIST_WEB_ISSUER: ${MPRELIST_KEYCLOAK_URL:?the public https:// address Keycloak is served at}/realms/mprelist
      MPRELIST_WEB_API_BASE_URL: ${MPRELIST_API_BASE_URL:?where this API is served from}
    # nginx and a directory of static files. The smallest number here by an order of magnitude, and the one
    # most likely to be read as a mistake: it is not, there is no runtime in this container.
    mem_limit: 64m
    # **No `ports`.** Reached at both `www.` and `admin.<domain>` through `caddy`, which redirects the second
    # of those to `/admin` — this bundle picks its surface by path and knows nothing about the host, so the
    # browser's address is what has to change and an internal rewrite would not do it.
    healthcheck:
      # `/success` rather than `/`: it is a path no file matches, so what this proves is the fallback that
      # T55 exists to get right — the page a customer lands on after the money has moved.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/success"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  caddy:
    # The fifth container, and the whole of what the internet can reach (T56, #87, ADR-0023). Its
    # configuration is ./caddy/Caddyfile, which is where the four hostnames are, and the redirect that makes
    # `admin.` serve the admin surface.
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Ordering only — **deliberately not `condition: service_healthy`**, which was the first thing written
    # here and is worse than what it prevents. It would mean an unhealthy API keeps the one container that
    # binds 80 and 443 from starting at all: a bad backend deploy would take the marketing site down with it
    # and stop Let's Encrypt from reaching the ACME challenge, which is how a one-container outage becomes an
    # expired certificate. And it buys nothing, because `up -d --wait` waits on every service's healthcheck
    # regardless — a failing API already fails the deploy, with or without this.
    depends_on:
      - api
      - web
      - keycloak
    environment:
      # Read by the Caddyfile as `{$…}`. The same four addresses the API validates tokens against and the
      # realm registers, which is why they are variables in one file and read in several.
      MPRELIST_WEB_BASE_URL: ${MPRELIST_WEB_BASE_URL:?where the site is served from}
      MPRELIST_ADMIN_BASE_URL: ${MPRELIST_ADMIN_BASE_URL:?where the admin corner is served from}
      MPRELIST_API_BASE_URL: ${MPRELIST_API_BASE_URL:?where this API is served from}
      MPRELIST_KEYCLOAK_URL: ${MPRELIST_KEYCLOAK_URL:?the public https:// address Keycloak is served at}
      # The bare domain, which redirects to the site. Required rather than optional: sslip.io gives you an
      # apex as readily as it gives you the four names, so there is no deployment that has no answer for this.
      MPRELIST_APEX_URL: ${MPRELIST_APEX_URL:?the bare domain, which redirects to the site}
      # Where Let's Encrypt writes when a certificate is about to expire and nothing has renewed it.
      MPRELIST_ACME_EMAIL: ${MPRELIST_ACME_EMAIL:?the address Let us Encrypt sends expiry warnings to}
      # **Staging while the hostnames are being made to resolve, production once they do.** Both URLs are in
      # production.env.example. Getting a Caddyfile right is what spends Let's Encrypt's duplicate limit —
      # 5 per 7 days for an identical name set — not renewals, which are six a year.
      MPRELIST_ACME_CA: ${MPRELIST_ACME_CA:?the ACME directory URL, staging until the four hostnames resolve}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Same certificate, same routes; without it a browser that offers QUIC silently falls back,
      # which is fine and is also a thing nobody would ever notice was happening.
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # **A named volume, and it is load-bearing.** The certificate *and the ACME account key* live in /data.
      # Without this, every `up` starts Caddy with nothing to renew, so it asks for a **new** certificate for
      # the identical four-name set — which is the duplicate limit above, spent by every deploy rather than by
      # any renewal.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    healthcheck:
      # Caddy's own admin API on 2019, which is loopback-only inside the container. A listening 443 would say
      # nothing about whether a certificate was ever obtained; this says the config loaded.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  # Certificates and the ACME account key. Losing it is not an outage — Caddy issues again — it is five
  # issuances a week and then a rate limit, on the day somebody is already debugging something else.
  caddy_data:
  caddy_config:
