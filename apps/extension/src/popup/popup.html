<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The popup follows the browser's theme, which is what the token sheet in
      @mprelist/ui does too. Said here as well so that the frame Chrome paints
      before the bundle runs is the right colour rather than a white flash on the
      way into a dark popup.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>{{brand.name}}</title>
  </head>
  <body>
    <!--
      Everything below this line is rendered by popup.js (T29, #38). The styles
      come with it: `@mprelist/ui`'s token sheet and this surface's own rules are
      strings injected by the components, so there is no stylesheet to link and
      no CSS pipeline in a bundle that also has to run inside a shadow root later.
    -->
    <div id="root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
